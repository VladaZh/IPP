openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /authors:
    get:
      tags:
      - authors
      summary: Get Authors
      operationId: get_authors_authors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Get Authors Authors Get
  /books:
    get:
      tags:
      - books
      summary: Get All Books
      operationId: get_all_books_books_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PydanticBook'
                type: array
                title: Response Get All Books Books Get
    post:
      tags:
      - books
      summary: Creating Book
      operationId: creating_book_books_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PydanticBook'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /books/{book_id}:
    get:
      tags:
      - books
      summary: Getting Book By Id
      operationId: getting_book_by_id_books__book_id__get
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PydanticBook'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - books
      summary: Put Book
      operationId: put_book_books__book_id__put
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PydanticBook'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - books
      summary: Patch Book
      operationId: patch_book_books__book_id__patch
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PydanticBook'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - books
      summary: Deleting Book
      operationId: deleting_book_books__book_id__delete
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /books/by-author/{temp_author}:
    get:
      tags:
      - books
      summary: Getting Books By Author
      operationId: getting_books_by_author_books_by_author__temp_author__get
      parameters:
      - name: temp_author
        in: path
        required: true
        schema:
          type: string
          title: Temp Author
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PydanticBook'
                title: Response Getting Books By Author Books By Author  Temp Author  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      summary: Read Root
      operationId: read_root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    BookCreate:
      properties:
        name:
          type: string
          title: Name
        author:
          type: string
          title: Author
      type: object
      required:
      - name
      - author
      title: BookCreate
    BookUpdate:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        author:
          anyOf:
          - type: string
          - type: 'null'
          title: Author
      type: object
      title: BookUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PydanticBook:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        author:
          type: string
          title: Author
      type: object
      required:
      - id
      - name
      - author
      title: PydanticBook
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
