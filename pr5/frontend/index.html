<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека - Управление книгами</title>
    <!-- Подключаем Bootstrap для красивого вида -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .book-card { transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-4">📚 Моя Библиотека</h1>

    <!-- Форма добавления и поиска -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card p-3">
                <h5>Добавить новую книгу</h5>
                <form id="addBookForm">
                    <div class="mb-2">
                        <input type="text" class="form-control" id="newBookName" placeholder="Название книги" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" class="form-control" id="newBookAuthor" placeholder="Автор" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Добавить</button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3">
                <h5>Поиск по автору</h5>
                <div class="input-group">
                    <input type="text" class="form-control" id="searchAuthor" placeholder="Введите имя автора...">
                    <button class="btn btn-outline-secondary" type="button" onclick="filterByAuthor()">Найти</button>
                    <button class="btn btn-outline-primary" type="button" onclick="loadBooks()">Сброс</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Список книг -->
    <h4 class="mb-3">Список книг</h4>
    <div class="table-responsive">
        <table class="table table-hover bg-white rounded shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Автор</th>
                    <th style="width: 150px;">Действия</th>
                </tr>
            </thead>
            <tbody id="booksTableBody">
                <!-- Сюда JavaScript будет вставлять книги -->
                <tr><td colspan="4" class="text-center">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно для редактирования -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактировать книгу</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editBookForm">
                    <input type="hidden" id="editBookId">
                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        <input type="text" class="form-control" id="editBookName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Автор</label>
                        <input type="text" class="form-control" id="editBookAuthor" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Сохранить изменения</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Подключаем Bootstrap JS и наш скрипт -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'https://ipp-production.up.railway.app';

    // Загрузка книг при открытии страницы
    document.addEventListener('DOMContentLoaded', loadBooks);

    // 1. Получить все книги (GET /books)
    async function loadBooks() {
        try {
            const response = await fetch(`${API_URL}/books`);
            const books = await response.json();
            renderBooks(books);
        } catch (error) {
            console.error('Ошибка загрузки книг:', error);
            document.getElementById('booksTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Ошибка подключения к API</td></tr>';
        }
    }

    // Отрисовка таблицы
    function renderBooks(books) {
        const tbody = document.getElementById('booksTableBody');
        tbody.innerHTML = '';

        if (books.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center">Книг пока нет. Добавьте первую!</td></tr>';
            return;
        }

        books.forEach(book => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${book.id}</td>
                <td>${book.name}</td>
                <td>${book.author}</td>
                <td>
                    <button class="btn btn-sm btn-warning me-1" onclick="openEditModal(${book.id}, '${book.name}', '${book.author}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteBook(${book.id})">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 2. Добавить книгу (POST /books)
    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('newBookName').value;
        const author = document.getElementById('newBookAuthor').value;

        try {
            const response = await fetch(`${API_URL}/books`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, author })
            });

            if (response.ok) {
                document.getElementById('addBookForm').reset();
                loadBooks();
            } else {
                alert('Ошибка при добавлении книги');
            }
        } catch (error) {
            console.error(error);
            alert('Ошибка сети');
        }
    });

    // 3. Удалить книгу (DELETE /books/{id})
    async function deleteBook(id) {
        if (!confirm('Вы уверены, что хотите удалить эту книгу?')) return;

        try {
            const response = await fetch(`${API_URL}/books/${id}`, { method: 'DELETE' });
            if (response.ok) {
                loadBooks();
            } else {
                alert('Не удалось удалить книгу');
            }
        } catch (error) {
            console.error(error);
        }
    }

    // 4. Открыть модальное окно для редактирования
    function openEditModal(id, name, author) {
        document.getElementById('editBookId').value = id;
        document.getElementById('editBookName').value = name;
        document.getElementById('editBookAuthor').value = author;

        const modal = new bootstrap.Modal(document.getElementById('editModal'));
        modal.show();
    }

    // 5. Обновить книгу (PATCH /books/{id})
    document.getElementById('editBookForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editBookId').value;
        const name = document.getElementById('editBookName').value;
        const author = document.getElementById('editBookAuthor').value;

        try {
            const response = await fetch(`${API_URL}/books/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, author })
            });

            if (response.ok) {
                // Закрываем модальное окно
                const modalEl = document.getElementById('editModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();

                loadBooks();
            } else {
                alert('Ошибка при обновлении');
            }
        } catch (error) {
            console.error(error);
        }
    });

    // 6. Поиск по автору (GET /books/by-author/{author})
    async function filterByAuthor() {
        const author = document.getElementById('searchAuthor').value.trim();
        if (!author) {
            loadBooks();
            return;
        }

        try {
            const response = await fetch(`${API_URL}/books/by-author/${encodeURIComponent(author)}`);
            const books = await response.json();
            renderBooks(books);
        } catch (error) {
            console.error('Ошибка поиска:', error);
        }
    }
</script>

</body>
</html>
